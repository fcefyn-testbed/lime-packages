name: Check trusted author

on:
  workflow_call:
    outputs:
      trusted:
        description: "'true' if the actor can run physical-lab jobs unattended"
        value: ${{ jobs.check.outputs.trusted }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - uses: actions/github-script@v7
        id: check
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.eventName === 'schedule') {
              core.setOutput('trusted', 'true');
              return;
            }
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('trusted', 'false');
              return;
            }
            const association = context.payload.pull_request.author_association;
            if (['MEMBER', 'OWNER'].includes(association)) {
              core.setOutput('trusted', 'true');
              return;
            }
            const author = context.payload.pull_request.user.login;
            try {
              await github.rest.orgs.checkPublicMembershipForUser({
                org: 'libremesh',
                username: author,
              });
              core.setOutput('trusted', 'true');
            } catch {
              core.setOutput('trusted', 'false');
            }
